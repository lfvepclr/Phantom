[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# cargo xtask alias: `cargo xtask <args>` → `cargo run -p xtask -- <args>`
[alias]
xtask = "run -p xtask --"

# Hardware crypto backends (RustCrypto cfg flags, stable since Rust 1.61):
#   aes_armv8          — AES ARMv8 crypto intrinsics (aes 0.8.4)
#   polyval_armv8      — GHASH PMULL intrinsics (polyval 0.6.2, via ghash)
#   chacha20_force_neon — ChaCha20 NEON backend (chacha20 0.9.1)
# Without these flags every cipher falls back to pure-software implementations
# (measured: AES-256-GCM ~177 MiB/s on Apple Silicon instead of multi-GB/s).
#
# `target-feature=+aes` (ohos entry below) is a second, independent switch: it
# tells the compiler the CPU has the AES unit, which both lets LLVM use the
# intrinsics directly and short-circuits the RustCrypto runtime probe. That
# probe is what breaks on HarmonyOS: `cpufeatures` implements detection for
# Linux/Android/Apple only, so on `target_os = "ohos"` it answers "no AES
# support" and the client paid software-AES speed while the intrinsics sat
# unused in the binary. Runtime detection still applies on Linux/macOS, where it
# falls back safely on CPUs without the crypto extensions.
[target.aarch64-apple-darwin]
rustflags = ["--cfg=aes_armv8", "--cfg=polyval_armv8", "--cfg=chacha20_force_neon"]

# HarmonyOS cross-compilation (aarch64-unknown-linux-ohos)
[target.aarch64-unknown-linux-ohos]
linker = "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang"
rustflags = [
    "--cfg=aes_armv8",
    "--cfg=polyval_armv8",
    "--cfg=chacha20_force_neon",
    "-C", "target-feature=+aes",
]

# Router / Linux-ARM cross-compilation (statically linked musl targets).
#
# `rust-lld` ships with the Rust toolchain and the dependency tree is pure
# Rust (no ring, no C shims), so neither musl-gcc nor a clang probe is needed.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["--cfg=aes_armv8", "--cfg=polyval_armv8", "--cfg=chacha20_force_neon"]

# x86_64 Linux servers (Alpine VPS / most cloud hosts). Same story:
# rust-lld links the toolchain's self-contained musl CRT, the dependency tree
# is pure Rust, and AES-NI is runtime-detected by RustCrypto on x86_64 (no cfg
# flags needed). Used by `cargo xtask package server --no-container` and
# `cargo xtask build server-amd64`; the default container path performs the
# same build inside deploy/Containerfile.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

# Legacy 32-bit ARMv7 routers (hard-float). Same story: rust-lld links, the
# pure-Rust dependency tree means no C cross toolchain is involved.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
