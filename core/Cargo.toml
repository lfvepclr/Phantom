[package]
name = "phantom-core"
version.workspace = true
edition.workspace = true

[dependencies]
# Original phantom-core deps
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
tracing = { workspace = true }
crossbeam-queue = { workspace = true }

# Merged from phantom-crypto
snow = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
ascon-aead = { workspace = true }
aead = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }
cfg-if = { workspace = true }
rand_core = "0.6"
zeroize = { workspace = true }

# Merged from phantom-protocol
bitflags = { workspace = true }

# Merged from phantom-transport
async-trait = { workspace = true }
quinn = { workspace = true }
quinn-hyphae = { workspace = true }
hyphae-handshake = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }

[features]
default = []
geoip = ["maxminddb"]

[dependencies.maxminddb]
version = "0.24"
optional = true

# `aes_armv8` / `polyval_armv8` / `chacha20_force_neon` are RustCrypto build
# cfg flags passed via RUSTFLAGS in .cargo/config.toml (hardware crypto
# backends). Declaring them here silences the unexpected_cfgs lint for the
# `cfg!(aes_armv8)` compile-time backend probe in crypto/cipher.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(aes_armv8)',
    'cfg(polyval_armv8)',
    'cfg(chacha20_force_neon)',
] }
