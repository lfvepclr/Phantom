[package]
name = "phantom-server"
version.workspace = true
edition.workspace = true

[lib]
name = "phantom_server"
path = "src/lib.rs"

[[bin]]
name = "phantom-server"
path = "src/bin.rs"

[features]
default = []
io-uring = ["dep:tokio-uring"]

[dependencies]
phantom-core = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
quinn = { workspace = true }
qr2term = { workspace = true }
serde_json = { workspace = true }

# tokio-uring needs glibc's statx bindings, which the musl libc crate does
# not provide — the io-uring feature is therefore limited to gnu targets.
# On musl (e.g. the static server-arm64 build) enabling it is a no-op with a
# compile-time warning, and the server falls back to the epoll runtime.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tokio-uring = { version = "0.5", optional = true }
