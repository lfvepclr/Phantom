# Container registry mirrors for Podman (equivalent of Docker's daemon.json).
#
# Why: registry-1.docker.io / hub.docker.com are unreachable from mainland
# China (verified: connection timeout), while these mirrors answer normally.
#
# Install (Podman):
#   # 1) host-side config used by the CLI when talking to a `podman machine`
#   mkdir -p ~/.config/containers
#   cp deploy/registries.container.conf ~/.config/containers/registries.conf
#
#   # 2) inside the VM (the machine reads its own copy)
#   podman machine ssh 'sudo tee /etc/containers/registries.conf' \
#     < deploy/registries.container.conf
#
# Docker Desktop users: the equivalent is /etc/docker/daemon.json
#   {"registry-mirrors": ["https://YOUR_ID.mirror.aliyuncs.com"]}

unqualified-search-registries = ["docker.io"]

[[registry]]
location = "docker.io"

# Aliyun personal accelerator (user-provided). Tried first.
[[registry.mirror]]
location = "YOUR_ID.mirror.aliyuncs.com"

# Community mirrors, verified to speak the registry API (HTTP 401 on /v2/).
[[registry.mirror]]
location = "docker.1ms.run"

[[registry.mirror]]
location = "docker.m.daocloud.io"
