[workspace]
resolver = "3"
members = [
    "core",
    "server",
    "client",
    "client/cli",
    "client/harmony",
    "xtask",
    "tests",
    "tests/bench",
]

default-members = [
    "core",
    "server",
    "client",
    "client/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Bytes
bytes = "1"

# Crypto
snow = { version = "0.9", features = ["risky-raw-split"] }
base64 = "0.22"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ascon-aead = "0.5"
aead = "0.5"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
cfg-if = "1"
zeroize = { version = "1.8", features = ["derive"] }

# QUIC
#
# `default-features = false` drops quinn's rustls/ring stack: the Noise
# handshake from quinn-hyphae replaces TLS entirely, which is what keeps the
# whole dependency tree free of C code. Verify with `cargo tree -i ring`.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "log"] }
quinn-hyphae = "0.1.0-beta.0"
hyphae-handshake = "0.1.0-beta.0"

# Raw socket options (SO_SNDBUF/SO_RCVBUF sized to the path BDP)
# "all" exposes the cross-platform socket options (TCP keepalive retries here);
# the default feature set only covers a subset.
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal QR code rendering (used by server bootstrap)
qr2term = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Async traits
async-trait = "0.1"

# Bitflags
bitflags = "2"

# Lock-free structures
crossbeam-queue = "0.3"

# Benchmark
divan = "0.1"

# Internal crates
phantom-core = { path = "core" }
phantom-client = { path = "client" }
phantom-server = { path = "server" }

# Release builds: cross-crate inlining + single codegen unit for maximum
# runtime performance (hot crypto/relay paths span crate boundaries).
# panic=abort: no #[should_panic] tests exist; smaller/faster binaries.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
